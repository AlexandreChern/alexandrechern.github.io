{% if site.giscus.enabled and site.giscus.repo_id != "" and site.giscus.category_id != "" %}
<section class="post-comments" aria-labelledby="comments-heading">
  <h2 id="comments-heading">Discussion</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo }}"
          data-repo-id="{{ site.giscus.repo_id }}"
          data-category="{{ site.giscus.category }}"
          data-category-id="{{ site.giscus.category_id }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="dark_dimmed"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <noscript>Please enable JavaScript to view the discussion powered by Giscus.</noscript>
</section>
{% endif %}
