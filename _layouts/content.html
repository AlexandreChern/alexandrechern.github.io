<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="{{ page.description | default: site.description | escape }}" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:100,300,400,700,900" rel="stylesheet" />
    <link href="{{ '/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/fontawesome.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/templatemo-style.css' | relative_url }}" />
    {% if page.math %}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: [["$", "$"], ["\\(", "\\)"]]
          }
        };
      </script>
      <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    {% endif %}
  </head>
  <body class="content-page">
    <div id="page-wraper">
      {% include site-sidebar.html %}
      <main class="section content-section">
        <div class="container">
          {{ content }}
        </div>
      </main>
    </div>
    <script src="{{ '/vendor/jquery/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/vendor/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>
    <script>
      (function () {
        var menu = document.getElementById("menu");
        document.getElementById("menu-toggle").addEventListener("click", function () {
          menu.classList.add("open");
        });
        document.getElementById("menu-close").addEventListener("click", function () {
          menu.classList.remove("open");
        });
      })();
    </script>
  </body>
</html>
